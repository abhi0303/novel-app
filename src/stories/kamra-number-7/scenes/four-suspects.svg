<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900">
  <defs>
    <linearGradient id="wall" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#16110d"/><stop offset="1" stop-color="#0b0907"/></linearGradient>
    <radialGradient id="spot" cx="50%" cy="20%" r="70%"><stop offset="0" stop-color="#ffd9a0" stop-opacity="0.2"/><stop offset="1" stop-color="#ffd9a0" stop-opacity="0"/></radialGradient>
    <linearGradient id="gold" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#e8c47a"/><stop offset="0.5" stop-color="#9c7130"/><stop offset="1" stop-color="#e2b86a"/></linearGradient>
    <radialGradient id="bgp" cx="50%" cy="35%" r="70%"><stop offset="0" stop-color="#4b5463"/><stop offset="1" stop-color="#1c212a"/></radialGradient>
    <clipPath id="o1"><ellipse cx="0" cy="0" rx="135" ry="175"/></clipPath>
