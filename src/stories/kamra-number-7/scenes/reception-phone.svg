  <ellipse cx="230" cy="544" rx="44" ry="8" fill="#6b4a22"/>
  <path d="M196 540 Q230 484 264 540Z" fill="#c99a48"/>
  <circle cx="230" cy="490" r="6" fill="#e2b86a"/>
