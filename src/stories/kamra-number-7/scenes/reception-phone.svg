  <path d="M640 545 L860 545 L830 440 L670 440Z" fill="#e7dcc6"/>
  <ellipse cx="750" cy="470" rx="58" ry="24" fill="#cfc2a8"/>
  <g fill="#8d816b"><circle cx="722" cy="462" r="6"/><circle cx="742" cy="456" r="6"/><circle cx="762" cy="456" r="6"/><circle cx="780" cy="464" r="6"/><circle cx="726" cy="480" r="6"/><circle cx="772" cy="482" r="6"/></g>
  <path d="M680 432 L820 432 L812 420 L688 420Z" fill="#cfc2a8"/>
