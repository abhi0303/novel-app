  <path d="M1060 540 L1100 540 L1094 470 L1066 470Z" fill="#6b4a22"/>
  <path d="M990 470 Q1080 400 1170 470Z" fill="#1f5a3c"/>
  <ellipse cx="1080" cy="470" rx="90" ry="10" fill="#ffd38a" opacity="0.7"/>
