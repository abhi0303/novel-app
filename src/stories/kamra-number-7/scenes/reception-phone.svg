<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900">
  <defs>
    <linearGradient id="wall" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#22170f"/><stop offset="1" stop-color="#140d08"/></linearGradient>
    <linearGradient id="top" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#5a3a22"/><stop offset="1" stop-color="#3a2414"/></linearGradient>
    <radialGradient id="lamp" cx="70%" cy="55%" r="45%"><stop offset="0" stop-color="#ffd38a" stop-opacity="0.55"/><stop offset="1" stop-color="#ffd38a" stop-opacity="0"/></radialGradient>
    <radialGradient id="vig" cx="50%" cy="50%" r="75%"><stop offset="0.5" stop-opacity="0"/><stop offset="1" stop-opacity="0.75"/></radialGradient>
    <linearGradient id="win" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#2b3e58"/><stop offset="1" stop-color="#101a28"/></linearGradient>
  </defs>
  <rect width="1600" height="900" fill="url(#wall)"/>
  <g stroke="#2e2015" stroke-width="3">
    <line x1="0" y1="430" x2="1600" y2="430"/>
    <line x1="200" y1="430" x2="200" y2="900"/><line x1="500" y1="430" x2="500" y2="900"/><line x1="800" y1="430" x2="800" y2="900"/><line x1="1100" y1="430" x2="1100" y2="900"/><line x1="1400" y1="430" x2="1400" y2="900"/>
  </g>
  <!-- window -->
  <rect x="1250" y="80" width="260" height="330" fill="url(#win)" stroke="#3b2717" stroke-width="14"/>
  <line x1="1380" y1="80" x2="1380" y2="410" stroke="#3b2717" stroke-width="8"/>
  <g stroke="#9db5d3" stroke-opacity="0.35" stroke-width="2">
