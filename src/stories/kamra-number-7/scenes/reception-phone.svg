    <text x="610" y="226">6</text><text x="710" y="226" fill="#e0a043">7</text><text x="810" y="226">8</text><text x="910" y="226">9</text><text x="1010" y="226">10</text>
  </g>
  <!-- counter -->
  <rect x="0" y="560" width="1600" height="340" fill="#2a1a0f"/>
  <rect x="0" y="540" width="1600" height="40" fill="url(#top)"/>
  <rect width="1600" height="900" fill="url(#lamp)"/>
