  <path d="M880 528 Q960 500 1010 532 Q1020 540 1006 548 L990 548 Q960 528 900 548 L884 548 Q872 540 880 528Z" fill="#e7dcc6"/>
  <path d="M846 520 C870 560 830 580 880 590 C930 600 890 620 930 620 C960 620 950 580 990 548" fill="none" stroke="#cfc2a8" stroke-width="5"/>
  <rect width="1600" height="900" fill="url(#vig)"/>
