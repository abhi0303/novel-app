  <circle cx="300" cy="200" r="104" fill="#3b2717"/>
  <circle cx="300" cy="200" r="88" fill="#efe4cc"/>
  <g stroke="#3b2717" stroke-width="4">
    <line x1="300" y1="120" x2="300" y2="134"/><line x1="380" y1="200" x2="366" y2="200"/><line x1="300" y1="280" x2="300" y2="266"/><line x1="220" y1="200" x2="234" y2="200"/>
  </g>
  <line x1="300" y1="200" x2="276" y2="152" stroke="#1d130b" stroke-width="7" stroke-linecap="round"/>
  <line x1="300" y1="200" x2="347" y2="146" stroke="#1d130b" stroke-width="4" stroke-linecap="round"/>
  <circle cx="300" cy="200" r="7" fill="#b8893a"/>
  <!-- key rack -->
  <rect x="560" y="110" width="520" height="190" rx="8" fill="#2c1d12" stroke="#4a3122" stroke-width="4"/>
  <g fill="#b8893a">
    <circle cx="610" cy="160" r="6"/><circle cx="710" cy="160" r="6"/><circle cx="810" cy="160" r="6"/><circle cx="910" cy="160" r="6"/><circle cx="1010" cy="160" r="6"/>
    <circle cx="610" cy="240" r="6"/><circle cx="710" cy="240" r="6"/><circle cx="810" cy="240" r="6"/><circle cx="910" cy="240" r="6"/><circle cx="1010" cy="240" r="6"/>
  </g>
  <g fill="#c99a48">
    <rect x="604" y="168" width="12" height="34" rx="3"/><rect x="704" y="168" width="12" height="34" rx="3"/><rect x="804" y="168" width="12" height="34" rx="3"/><rect x="904" y="168" width="12" height="34" rx="3"/><rect x="1004" y="168" width="12" height="34" rx="3"/>
    <rect x="604" y="248" width="12" height="34" rx="3"/><rect x="804" y="248" width="12" height="34" rx="3"/><rect x="904" y="248" width="12" height="34" rx="3"/><rect x="1004" y="248" width="12" height="34" rx="3"/>
  </g>
  <g font-family="Georgia, serif" font-size="18" fill="#8a6a3a" text-anchor="middle">
