<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900">
  <defs>
    <linearGradient id="wall" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#1e2420"/><stop offset="1" stop-color="#121613"/></linearGradient>
    <radialGradient id="tube" cx="40%" cy="0%" r="80%"><stop offset="0" stop-color="#e9f2e6" stop-opacity="0.35"/><stop offset="1" stop-color="#000" stop-opacity="0.5"/></radialGradient>
    <linearGradient id="porc" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#cfc6b6"/><stop offset="0.4" stop-color="#fbf6ec"/><stop offset="1" stop-color="#bdb3a2"/></linearGradient>
    <linearGradient id="doorlight" x1="1" y1="0" x2="0" y2="0"><stop offset="0" stop-color="#ffd38a" stop-opacity="0.5"/><stop offset="1" stop-color="#ffd38a" stop-opacity="0"/></linearGradient>
  </defs>
  <rect width="1600" height="900" fill="url(#wall)"/>
  <!-- shelves -->
  <g fill="#3a3024"><rect x="80" y="160" width="700" height="16"/><rect x="80" y="320" width="700" height="16"/></g>
  <g fill="#e8e1d4">
    <path d="M120 160 L170 160 L164 110 L126 110Z"/><path d="M190 160 L240 160 L234 110 L196 110Z"/><path d="M260 160 L310 160 L304 110 L266 110Z"/><path d="M330 160 L380 160 L374 110 L336 110Z"/>
    <ellipse cx="500" cy="150" rx="70" ry="12"/><ellipse cx="500" cy="138" rx="70" ry="12"/><ellipse cx="500" cy="126" rx="70" ry="12"/>
  </g>
  <rect x="620" y="250" width="110" height="70" fill="#f4f6f2"/><rect x="620" y="250" width="110" height="16" fill="#3f9a5e"/>
  <rect x="120" y="260" width="90" height="60" fill="#5a4630"/><rect x="230" y="270" width="70" height="50" fill="#7a5a3a"/>
  <!-- counter -->
  <rect x="0" y="600" width="1600" height="300" fill="#2b241c"/>
  <rect x="0" y="580" width="1600" height="30" fill="#4a3c2c"/>
  <!-- tray alone -->
  <ellipse cx="560" cy="590" rx="260" ry="50" fill="#7f848b"/>
  <ellipse cx="560" cy="582" rx="244" ry="42" fill="#b9bdc3"/>
  <path d="M400 560 Q400 640 480 640 Q560 640 560 560 Q560 510 480 504 Q400 510 400 560Z" fill="url(#porc)"/>
  <path d="M560 556 Q610 540 622 500" stroke="#e8e1d4" stroke-width="14" fill="none" stroke-linecap="round"/>
  <ellipse cx="480" cy="506" rx="50" ry="11" fill="#e2dacb"/>
  <ellipse cx="660" cy="600" rx="70" ry="20" fill="#efe8db"/>
  <path d="M614 566 Q618 610 660 612 Q702 610 706 566Z" fill="url(#porc)"/>
  <ellipse cx="660" cy="566" rx="46" ry="12" fill="#f7f1e6"/>
  <!-- half-open door with light -->
  <rect x="1130" y="120" width="300" height="480" fill="#0a0c0b"/>
  <polygon points="1130,120 1250,150 1250,620 1130,600" fill="#3a2e22"/>
  <rect x="1250" y="150" width="180" height="450" fill="url(#doorlight)"/>
  <!-- long shadow on the wall -->
  <path d="M1010 600 Q1000 420 960 360 Q930 320 950 270 Q970 230 1000 250 Q1030 270 1010 330 Q1060 380 1080 600Z" fill="#000" opacity="0.55"/>
  <!-- stopwatch -->
  <g transform="translate(1380 760)">
    <circle r="92" fill="#16130f" stroke="#e0a043" stroke-width="8"/>
    <rect x="-16" y="-122" width="32" height="26" rx="6" fill="#e0a043"/>
    <path d="M0 0 L0 -70" stroke="#e0a043" stroke-width="6" stroke-linecap="round"/>
    <path d="M0 -80 A80 80 0 1 1 -1 -80" fill="none" stroke="#e0a043" stroke-width="4" stroke-dasharray="6 10" opacity="0.6"/>
    <text y="40" font-family="ui-monospace, Menlo, monospace" font-size="34" fill="#e0a043" text-anchor="middle">01:00</text>
  </g>
  <rect width="1600" height="900" fill="url(#tube)"/>
</svg>
