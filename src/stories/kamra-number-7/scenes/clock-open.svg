  <circle cx="1300" cy="450" r="70" fill="#3a3a3a"/><circle cx="1300" cy="450" r="50" fill="#1a1a1a"/>
  <line x1="1300" y1="450" x2="1336" y2="414" stroke="#e2b13c" stroke-width="10" stroke-linecap="round"/>
