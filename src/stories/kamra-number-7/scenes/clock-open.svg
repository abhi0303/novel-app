<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900">
  <defs>
    <linearGradient id="bench" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#26313e"/><stop offset="1" stop-color="#121820"/></linearGradient>
    <radialGradient id="light" cx="45%" cy="30%" r="65%"><stop offset="0" stop-color="#e6f0ff" stop-opacity="0.2"/><stop offset="1" stop-color="#e6f0ff" stop-opacity="0"/></radialGradient>
    <radialGradient id="brass" cx="40%" cy="35%" r="70%"><stop offset="0" stop-color="#e8c47a"/><stop offset="1" stop-color="#6b4a1c"/></radialGradient>
  </defs>
  <rect width="1600" height="900" fill="url(#bench)"/>
  <rect width="1600" height="900" fill="url(#light)"/>
  <!-- clock back, opened -->
  <circle cx="520" cy="440" r="250" fill="url(#brass)"/>
  <circle cx="520" cy="440" r="210" fill="#3a2a12"/>
  <circle cx="520" cy="440" r="200" fill="#4b3818"/>
