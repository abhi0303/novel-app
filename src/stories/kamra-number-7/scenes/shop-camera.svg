<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#1b1712"/><stop offset="1" stop-color="#3a3024"/></linearGradient>
    <radialGradient id="sodium" cx="70%" cy="10%" r="60%"><stop offset="0" stop-color="#ffb14a" stop-opacity="0.5"/><stop offset="1" stop-color="#ffb14a" stop-opacity="0"/></radialGradient>
    <pattern id="scan" width="4" height="4" patternUnits="userSpaceOnUse"><rect width="4" height="2" fill="#000" opacity="0.16"/></pattern>
    <pattern id="rain" width="28" height="70" patternUnits="userSpaceOnUse" patternTransform="rotate(10)"><line x1="5" y1="0" x2="5" y2="24" stroke="#f2e2c8" stroke-width="1.5" stroke-opacity="0.28"/></pattern>
    <filter id="lofi"><feGaussianBlur stdDeviation="1.4"/></filter>
    <radialGradient id="vig" cx="50%" cy="50%" r="72%"><stop offset="0.5" stop-opacity="0"/><stop offset="1" stop-opacity="0.85"/></radialGradient>
    <radialGradient id="cab"><stop offset="0" stop-color="#fff0c8" stop-opacity="0.9"/><stop offset="1" stop-color="#fff0c8" stop-opacity="0"/></radialGradient>
  </defs>
  <rect width="1600" height="900" fill="url(#bg)"/>
  <rect width="1600" height="900" fill="url(#sodium)"/>
  <g filter="url(#lofi)">
