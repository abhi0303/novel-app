    <!-- another car -->
    <rect x="1250" y="560" width="300" height="130" rx="30" fill="#151515"/><rect x="1290" y="510" width="200" height="70" rx="20" fill="#151515"/>
    <!-- white sedan, door open, interior light -->
    <circle cx="560" cy="600" r="160" fill="url(#cab)" opacity="0.6"/>
    <path d="M300 690 L300 620 Q310 580 380 570 L460 520 Q500 500 560 500 L700 500 Q760 500 800 540 L850 570 Q900 580 900 620 L900 690Z" fill="#e8e6e1"/>
