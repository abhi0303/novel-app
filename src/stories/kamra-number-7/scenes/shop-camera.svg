      <polygon points="1060,166 1110,163 1104,219 1056,222" fill="#2f6fd0"/><polygon points="1160,158 1210,154 1204,210 1156,214" fill="#efe9dc"/><polygon points="1260,148 1310,143 1304,199 1256,204" fill="#c0392b"/><polygon points="1360,136 1410,130 1404,186 1356,192" fill="#2e8b57"/><polygon points="1460,124 1510,118 1504,174 1456,180" fill="#e5c22e"/>
