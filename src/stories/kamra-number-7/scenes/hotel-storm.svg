<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900">
  <defs>
    <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#05080d"/><stop offset="1" stop-color="#182435"/>
    </linearGradient>
    <radialGradient id="flash" cx="20%" cy="10%" r="55%">
      <stop offset="0" stop-color="#c9dcf5" stop-opacity="0.55"/><stop offset="1" stop-color="#c9dcf5" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="glow"><stop offset="0" stop-color="#ffcf7a" stop-opacity="0.85"/><stop offset="0.45" stop-color="#f2a640" stop-opacity="0.3"/><stop offset="1" stop-color="#f2a640" stop-opacity="0"/></radialGradient>
    <filter id="soft"><feGaussianBlur stdDeviation="4"/></filter>
    <pattern id="rain" width="40" height="80" patternUnits="userSpaceOnUse" patternTransform="rotate(16)">
      <line x1="6" y1="0" x2="6" y2="30" stroke="#c4d6ec" stroke-width="1.4" stroke-opacity="0.4"/>
      <line x1="26" y1="38" x2="26" y2="60" stroke="#c4d6ec" stroke-width="1" stroke-opacity="0.25"/>
    </pattern>
    <radialGradient id="vig" cx="50%" cy="50%" r="75%"><stop offset="0.5" stop-opacity="0"/><stop offset="1" stop-opacity="0.75"/></radialGradient>
  </defs>
  <rect width="1600" height="900" fill="url(#sky)"/>
  <rect width="1600" height="900" fill="url(#flash)"/>
  <path d="M300 0 l-30 110 l44 -10 l-70 160 l34 -8 l-58 140" fill="none" stroke="#eef4ff" stroke-width="5" filter="url(#soft)"/>
  <path d="M300 0 l-30 110 l44 -10 l-70 160 l34 -8 l-58 140" fill="none" stroke="#fff" stroke-width="2"/>
  <!-- facade -->
  <polygon points="140,250 800,90 1460,250" fill="#090e15"/>
  <rect x="180" y="250" width="1240" height="650" fill="#111925"/>
  <polygon points="700,250 800,150 900,250" fill="#0d141e"/>
  <g fill="#1b2635">
    <rect x="250" y="300" width="80" height="130"/><rect x="420" y="300" width="80" height="130"/>
    <rect x="590" y="300" width="80" height="130"/><rect x="930" y="300" width="80" height="130"/>
    <rect x="1100" y="300" width="80" height="130"/><rect x="1270" y="300" width="80" height="130"/>
    <rect x="250" y="500" width="80" height="130"/><rect x="420" y="500" width="80" height="130"/>
    <rect x="590" y="500" width="80" height="130"/><rect x="760" y="500" width="80" height="130"/>
    <rect x="930" y="500" width="80" height="130"/><rect x="1100" y="500" width="80" height="130"/>
    <rect x="1270" y="500" width="80" height="130"/>
  </g>
  <!-- room 7 -->
  <circle cx="800" cy="365" r="190" fill="url(#glow)"/>
  <rect x="760" y="300" width="80" height="130" fill="#f4c06a"/>
  <path d="M780 430 L780 372 Q800 340 820 372 L820 430Z" fill="#3a2410"/>
  <circle cx="800" cy="356" r="14" fill="#3a2410"/>
  <rect x="760" y="300" width="80" height="130" fill="none" stroke="#5b3a14" stroke-width="6"/>
  <line x1="800" y1="300" x2="800" y2="430" stroke="#5b3a14" stroke-width="4"/>
  <!-- ground floor reception -->
  <rect x="180" y="700" width="1240" height="16" fill="#0a0f16"/>
  <rect x="690" y="730" width="220" height="170" fill="#2e2214"/>
  <rect x="705" y="745" width="190" height="155" fill="#d79a45" opacity="0.55"/>
  <circle cx="800" cy="800" r="200" fill="url(#glow)" opacity="0.5"/>
  <g fill="#1b2635"><rect x="270" y="740" width="90" height="120"/><rect x="460" y="740" width="90" height="120"/><rect x="1050" y="740" width="90" height="120"/><rect x="1240" y="740" width="90" height="120"/></g>
  <rect x="270" y="740" width="90" height="120" fill="#d79a45" opacity="0.25"/>
  <rect width="1600" height="900" fill="url(#rain)"/>
  <rect width="1600" height="900" fill="url(#vig)"/>
</svg>
