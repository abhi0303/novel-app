    <filter id="blur"><feGaussianBlur stdDeviation="22"/></filter>
    <filter id="soft"><feGaussianBlur stdDeviation="6"/></filter>
    <linearGradient id="road" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#5d6773"/><stop offset="1" stop-color="#20262e"/></linearGradient>
    <radialGradient id="red"><stop offset="0" stop-color="#ff4a3d" stop-opacity="0.9"/><stop offset="1" stop-color="#ff4a3d" stop-opacity="0"/></radialGradient>
    <radialGradient id="blue"><stop offset="0" stop-color="#3d8bff" stop-opacity="0.9"/><stop offset="1" stop-color="#3d8bff" stop-opacity="0"/></radialGradient>
    <symbol id="pine" viewBox="0 0 100 300"><polygon points="50,0 70,60 60,60 82,120 68,120 92,190 74,190 100,260 56,260 56,300 44,300 44,260 0,260 26,190 8,190 32,120 18,120 40,60 30,60"/></symbol>
