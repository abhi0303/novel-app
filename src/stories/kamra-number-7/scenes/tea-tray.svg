    <linearGradient id="porc" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#cfc6b6"/><stop offset="0.4" stop-color="#fbf6ec"/><stop offset="1" stop-color="#bdb3a2"/></linearGradient>
    <radialGradient id="tea" cx="50%" cy="40%" r="60%"><stop offset="0" stop-color="#9b6030"/><stop offset="1" stop-color="#4a2a12"/></radialGradient>
    <radialGradient id="warm" cx="75%" cy="45%" r="50%"><stop offset="0" stop-color="#ffc979" stop-opacity="0.35"/><stop offset="1" stop-color="#ffc979" stop-opacity="0"/></radialGradient>
    <filter id="steam"><feGaussianBlur stdDeviation="6"/></filter>
