  <ellipse cx="1050" cy="542" rx="58" ry="13" fill="#e2dacb"/>
  <ellipse cx="1290" cy="680" rx="96" ry="30" fill="#efe8db"/>
  <path d="M1226 630 Q1230 690 1290 694 Q1350 690 1354 630Z" fill="url(#porc)"/>
