<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900">
  <defs>
    <linearGradient id="wall" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#140f0b"/><stop offset="1" stop-color="#1e1610"/></linearGradient>
    <linearGradient id="win" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#9fb8da"/><stop offset="1" stop-color="#2c3e58"/></linearGradient>
    <radialGradient id="candle"><stop offset="0" stop-color="#ffd38a" stop-opacity="0.8"/><stop offset="1" stop-color="#ffd38a" stop-opacity="0"/></radialGradient>
    <linearGradient id="table" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#3a2414"/><stop offset="1" stop-color="#5a3a20"/></linearGradient>
    <pattern id="rain" width="26" height="64" patternUnits="userSpaceOnUse" patternTransform="rotate(8)"><line x1="5" y1="0" x2="5" y2="22" stroke="#e8f0ff" stroke-width="1.4" stroke-opacity="0.35"/></pattern>
  </defs>
  <rect width="1600" height="900" fill="url(#wall)"/>
  <!-- arched windows -->
  <g>
    <path d="M520 520 L520 220 Q600 130 680 220 L680 520Z" fill="url(#win)"/>
    <path d="M720 520 L720 200 Q800 100 880 200 L880 520Z" fill="url(#win)"/>
    <path d="M920 520 L920 220 Q1000 130 1080 220 L1080 520Z" fill="url(#win)"/>
    <path d="M520 520 L520 220 Q600 130 680 220 L680 520Z" fill="url(#rain)"/>
    <path d="M720 520 L720 200 Q800 100 880 200 L880 520Z" fill="url(#rain)"/>
    <path d="M920 520 L920 220 Q1000 130 1080 220 L1080 520Z" fill="url(#rain)"/>
    <g stroke="#140f0b" stroke-width="8"><line x1="600" y1="160" x2="600" y2="520"/><line x1="800" y1="130" x2="800" y2="520"/><line x1="1000" y1="160" x2="1000" y2="520"/><line x1="520" y1="360" x2="1080" y2="360"/></g>
    <path d="M840 140 l-20 70 l26 -6 l-34 84" fill="none" stroke="#fff" stroke-width="3" opacity="0.8"/>
  </g>
  <!-- chandelier -->
  <line x1="800" y1="0" x2="800" y2="70" stroke="#3a2a14" stroke-width="4"/>
  <path d="M700 90 Q800 140 900 90" fill="none" stroke="#b8893a" stroke-width="6"/>
  <g fill="#ffd38a"><circle cx="700" cy="86" r="8"/><circle cx="750" cy="104" r="8"/><circle cx="800" cy="110" r="8"/><circle cx="850" cy="104" r="8"/><circle cx="900" cy="86" r="8"/></g>
  <circle cx="800" cy="100" r="120" fill="url(#candle)" opacity="0.5"/>
  <!-- Dev standing at the far end, backlit -->
  <g fill="#050403">
    <circle cx="800" cy="330" r="30"/>
    <path d="M748 380 Q800 356 852 380 L866 560 L734 560Z"/>
  </g>
  <!-- table in perspective -->
  <polygon points="660,560 940,560 1260,900 340,900" fill="url(#table)"/>
  <polygon points="660,560 940,560 950,575 650,575" fill="#2a190e"/>
  <!-- candles -->
  <g>
    <rect x="770" y="590" width="10" height="34" fill="#f2ead8"/><rect x="820" y="590" width="10" height="34" fill="#f2ead8"/>
    <rect x="740" y="690" width="14" height="50" fill="#f2ead8"/><rect x="846" y="690" width="14" height="50" fill="#f2ead8"/>
    <g fill="#ffcf6b"><ellipse cx="775" cy="582" rx="5" ry="10"/><ellipse cx="825" cy="582" rx="5" ry="10"/><ellipse cx="747" cy="678" rx="7" ry="14"/><ellipse cx="853" cy="678" rx="7" ry="14"/></g>
    <circle cx="800" cy="600" r="90" fill="url(#candle)" opacity="0.6"/><circle cx="800" cy="690" r="130" fill="url(#candle)" opacity="0.5"/>
  </g>
  <!-- seated silhouettes -->
  <g fill="#0a0806">
    <circle cx="610" cy="560" r="26"/><path d="M570 660 Q570 596 610 590 Q650 596 652 660Z"/>
    <circle cx="990" cy="560" r="26"/><path d="M950 660 Q950 596 990 590 Q1030 596 1032 660Z"/>
    <circle cx="470" cy="690" r="40"/><path d="M400 860 Q400 750 470 740 Q540 750 548 860Z"/>
    <circle cx="1130" cy="690" r="40"/><path d="M1060 860 Q1060 750 1130 740 Q1200 750 1208 860Z"/>
  </g>
  <path d="M440 640 Q470 600 500 640 L500 700 L440 700Z" fill="#0f6b74" opacity="0.6"/>
  <!-- Kabir by the door with files -->
  <g fill="#0a0806"><circle cx="1400" cy="400" r="26"/><path d="M1364 450 Q1400 430 1436 450 L1446 640 L1354 640Z"/></g>
  <rect x="1420" y="500" width="40" height="54" fill="#c9a96b" transform="rotate(-10 1440 527)"/>
  <rect x="1300" y="260" width="200" height="460" fill="none" stroke="#2a1d10" stroke-width="10"/>
</svg>
